[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kabootar-ai"
version = "0.1.0"
description = "Kabootar.ai (کبوتر) - Voice-First WhatsApp Operating Copilot powered by Pipecat & Playwright"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jawad" }
]
dependencies = [
    "pipecat-ai>=0.0.50",
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "loguru>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
